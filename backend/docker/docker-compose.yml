version: "3.9"

services:
  mongodb:
    image: mongo:latest
    container_name: mongo-506tracker
    restart: unless-stopped

    ports:
      - "27018:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin1234
      MONGO_INITDB_DATABASE: 506trackerdb

    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js

volumes:
  mongo_data: